services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: healthmonitor
      POSTGRES_PASSWORD: healthmonitor
      POSTGRES_DB: healthmonitor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
